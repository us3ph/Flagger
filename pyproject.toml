[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-answer-staleness-flagger"
version = "0.1.0"
description = "A small offline classifier for temporal volatility in factual sentences."
requires-python = ">=3.11"
dependencies = [
  "scikit-learn>=1.5,<1.9",
  "numpy>=1.26,<3",
  "joblib>=1.3,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
notebook = ["ipython>=8,<10", "nbformat>=5,<6"]

[project.scripts]
staleness-flagger = "flagger.cli:main"

[tool.setuptools.packages.find]
include = ["flagger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
